<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1417" viewBox="0 0 1200 1417" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">BoarOS 内核架构与多核执行分工</title>
  <desc id="desc">内核空间包含架构入口、共用内核子系统和设备驱动。两种架构都将系统调用交给公共分派器，将缺页异常交给内存管理。文件系统经块层连接块设备驱动，网络协议栈经以太网接入网卡驱动。蓝色标签表示调用核执行，琥珀色标签表示 CPU0 推进。QEMU virt 平台位于内核空间之外。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#70829b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="chip" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round">
      <rect x="5" y="5" width="14" height="14" rx="3"/>
      <rect x="9" y="9" width="6" height="6" rx="1"/>
      <path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/>
    </g>
    <g id="terminal" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="3"/>
      <path d="m6 9 3 3-3 3m6 0h5"/>
    </g>
    <g id="memory" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="12" rx="2"/>
      <path d="M7 10v4m5-4v4m5-4v4M7 18v3m5-3v3m5-3v3"/>
    </g>
    <g id="disk" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round">
      <ellipse cx="12" cy="6" rx="8" ry="3"/>
      <path d="M4 6v12c0 4 16 4 16 0V6M4 12c0 4 16 4 16 0"/>
    </g>
    <g id="network" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round">
      <circle cx="12" cy="5" r="3"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/>
      <path d="m10.6 7.7-4.2 7.6m7-7.6 4.2 7.6M8 18h8"/>
    </g>
    <g id="branch" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v6m0 0-7 5v6m7-11 7 5v6M2 17l3 3 3-3m8 0 3 3 3-3"/>
    </g>
    <g id="board" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <rect x="7" y="7" width="6" height="6" rx="1"/>
      <path d="M16 8h2m-2 4h2M7 16h3m3 0h5"/>
    </g>
  </defs>
  <style>
    text { font-family: system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #23334c; }
    .title { font-size: 30px; font-weight: 750; fill: #fff; }
    .subtitle { font-size: 15px; fill: #d7e6fd; }
    .section { font-size: 21px; font-weight: 700; }
    .heading { font-size: 20px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 16px; fill: #42536d; }
    .strong { font-weight: 650; }
    .card { fill: #fff; stroke: #d2dce9; }
    .rv { fill: #125985; }
    .la { fill: #8b365d; }
    .blue { fill: #194f9b; }
    .amber { fill: #8b4b13; }
    .teal { fill: #14635c; }
    .wire { fill: none; stroke: #647993; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .storage-wire { stroke: #9b6c3f; }
    .network-wire { stroke: #865398; }
    .arrow { marker-end: url(#arrow); }
  </style>

  <rect x="1" y="1" width="1198" height="1415" rx="19" fill="#f4f7fb" stroke="#d2dce9"/>

  <g aria-label="图题">
    <rect x="24" y="20" width="1152" height="70" rx="14" fill="#152a48"/>
    <rect x="45" y="37" width="36" height="36" rx="10" fill="#355482"/>
    <use href="#chip" x="51" y="43" color="#e8f2ff"/>
    <text class="title" x="99" y="54">BoarOS 内核架构</text>
    <text class="subtitle" x="101" y="76">从架构入口到共用子系统与设备</text>
    <g transform="translate(120)">
      <path d="M834 20v18h47l18 18h157m-126 0v14h126" fill="none" stroke="#6384b0" stroke-opacity=".38" stroke-width="1.4"/>
      <rect x="873" y="38" width="157" height="30" rx="15" fill="#2a456a"/>
      <text class="subtitle strong" x="951" y="58" text-anchor="middle">RV64 / LA64 · 1–8 核</text>
    </g>
  </g>

  <g aria-label="用户空间">
    <rect x="24" y="105" width="1152" height="62" rx="12" fill="#f3eeff" stroke="#dacdf4"/>
    <rect x="43" y="124" width="33" height="33" rx="9" fill="#e6dbfb"/>
    <use href="#terminal" x="47.5" y="128.5" color="#6d4899"/>
    <text class="heading" x="90" y="137">用户空间</text>
    <text class="small" x="90" y="158">已验证应用包括 BusyBox、SQLite WAL 和 Lua</text>
    <text class="body strong" x="627" y="137">musl / glibc</text>
    <text class="small" x="627" y="158">支持静态和动态链接的 ELF</text>
    <rect x="998" y="123" width="154" height="31" rx="15.5" fill="#e6dbfb"/>
    <text class="small strong" x="1075" y="144" text-anchor="middle">OSComp 评测适配</text>
  </g>

  <path class="wire arrow" d="M600 168v32"/>
  <text class="small" x="620" y="189">陷入内核</text>

  <g aria-label="内核空间">
    <rect x="16" y="201" width="1168" height="1032" rx="17" fill="#e9eff8" stroke="#a9bdd7" stroke-width="1.5"/>
    <path d="M33 201h1134a17 17 0 0 1 17 17v21H16v-21a17 17 0 0 1 17-17z" fill="#264362"/>
    <use href="#chip" x="38" y="208" color="#e3efff"/>
    <text class="section" x="75" y="227" style="fill:#fff">内核空间</text>
    <text class="subtitle" x="180" y="226">架构入口、共用子系统和设备驱动</text>

    <g aria-label="双架构入口和异常分流">
      <rect x="48" y="249" width="1104" height="255" rx="13" fill="#f7fafe" stroke="#c5d4e8"/>
      <use href="#branch" x="65" y="255" color="#315b8d"/>
      <text class="section" x="101" y="274">架构入口与分派</text>
      <text class="small" x="295" y="273">两种架构都从各自的异常入口进入，并按异常类型分流</text>

      <g aria-label="两种架构的异常入口">
        <rect x="66" y="284" width="1068" height="73" rx="10" fill="#e7effa" stroke="#b6cbe5"/>
        <text class="small strong" x="83" y="302">两种架构的异常入口</text>

        <rect x="80" y="308" width="510" height="41" rx="7" fill="#f0f8fd" stroke="#bfdcee"/>
        <text class="heading rv" x="95" y="326">RISC-V 64 · S-mode</text>
        <text class="small" x="95" y="343">ECALL 发起系统调用，SBI RFENCE 使远端 TLB 失效</text>

        <rect x="610" y="308" width="510" height="41" rx="7" fill="#fdf3f8" stroke="#eac9da"/>
        <text class="heading la" x="625" y="326">LoongArch 64 · PLV0</text>
        <text class="small" x="625" y="343">SYSCALL 发起系统调用，IPI 逐核确认远端 TLB 失效</text>
      </g>

      <g aria-label="按异常类型分流">
        <rect x="66" y="385" width="1068" height="92" rx="10" fill="#edf5f6" stroke="#bfd5da"/>
        <text class="small strong" x="83" y="405">按异常类型分流</text>

        <path class="wire" d="M600 357v53"/>
        <path class="wire arrow" d="M600 410H335v16"/>
        <path class="wire arrow" d="M600 410h265v16"/>
        <circle cx="600" cy="410" r="3.4" fill="#647993"/>

        <rect class="card" x="80" y="427" width="510" height="41" rx="7"/>
        <text class="heading blue" x="95" y="445">系统调用交给公共分派器</text>
        <text class="small" x="95" y="462">按编号选择处理函数，通过 uaccess 访问用户内存</text>

        <rect class="card" x="610" y="427" width="510" height="41" rx="7"/>
        <text class="heading teal" x="625" y="445">缺页异常（Page Fault）交给内存管理</text>
        <text class="small" x="625" y="462">查找虚拟内存区域，检查权限和后备来源</text>
      </g>

      <text class="small" x="66" y="494">系统调用失败时内核返回负错误码，libc 通常返回 -1 并设置 errno。</text>
      <text class="small" x="610" y="494">返回用户态前按需构造信号帧，sigreturn 恢复执行现场。</text>
    </g>
    <path class="wire arrow" d="M600 505v36"/>
    <text class="small" x="620" y="528">进入共用子系统</text>

    <rect x="48" y="542" width="1104" height="589" rx="14" fill="#f1f6fd" stroke="#b2c7e3" stroke-width="1.4"/>
    <path d="M62 542h1076a14 14 0 0 1 14 14v27H48v-27a14 14 0 0 1 14-14z" fill="#dae7f8"/>
    <g transform="translate(60 89)" aria-label="共用子系统与执行位置">
      <text class="section" x="24" y="481">共用内核子系统</text>
      <rect x="804" y="467" width="116" height="27" rx="13.5" fill="#e1edff"/>
      <text class="small blue strong" x="862" y="486" text-anchor="middle">调用核执行</text>
      <rect x="930" y="467" width="126" height="27" rx="13.5" fill="#ffedd8"/>
      <text class="small amber strong" x="993" y="486" text-anchor="middle">CPU0 推进</text>

      <rect class="card" x="24" y="506" width="502" height="168" rx="13"/>
      <rect x="44" y="523" width="35" height="35" rx="9" fill="#e7eeff"/>
      <use href="#chip" x="49.5" y="528.5" color="#315b9b"/>
      <text class="heading" x="92" y="547">任务管理与调度</text>
      <text class="small" x="504" y="546" text-anchor="end">struct kernel_task</text>
      <text class="body" x="46" y="575">每个就绪任务只进入一个 CPU 的队列。</text>
      <text class="body" x="46" y="598">各核管理普通任务的入队、领取和运行权交接。</text>
      <text class="body" x="46" y="621">迁移、亲和性和实时资格由共享调度状态协调。</text>
      <text class="body" x="46" y="642">任务退出后，等执行核完成切换，再回收内核栈。</text>
      <text class="small" x="46" y="661">fork / clone3 / exec / wait4</text>

      <rect class="card" x="554" y="506" width="502" height="149" rx="13"/>
      <rect x="574" y="523" width="35" height="35" rx="9" fill="#dcf3ee"/>
      <use href="#memory" x="579.5" y="528.5" color="#237468"/>
      <text class="heading" x="622" y="547">虚拟内存管理</text>
      <text class="body" x="576" y="575">伙伴系统分配物理页，Slab 管理内核小对象。</text>
      <text class="body" x="576" y="598">二分查找虚拟内存区域，确定权限与后备来源。</text>
      <text class="body" x="576" y="621">缺页时按需装入，fork 的私有页采用写时复制。</text>
      <text class="body" x="576" y="642">撤销映射后，等相关 CPU 确认 TLB 失效再归还页。</text>

      <rect class="card" x="24" y="688" width="502" height="222" rx="13"/>
      <rect x="44" y="705" width="35" height="35" rx="9" fill="#f8e9d9"/>
      <use href="#disk" x="49.5" y="710.5" color="#96602f"/>
      <text class="heading" x="92" y="729">文件系统与存储</text>
      <text class="body" x="46" y="757">VFS 区分路径、inode 与打开文件对象。</text>
      <text class="body" x="46" y="780">磁盘文件的读写和映射共用页缓存。</text>

      <rect x="46" y="791" width="72" height="22" rx="11" fill="#e1edff"/>
      <text class="small blue strong" x="82" y="807" text-anchor="middle">调用核</text>
      <text class="body" x="129" y="808">ext4 冷读、前台写回和目录操作</text>
      <rect x="46" y="817" width="72" height="22" rx="11" fill="#ffedd8"/>
      <text class="small amber strong" x="82" y="833" text-anchor="middle">CPU0</text>
      <text class="body" x="129" y="834">日志提交、回填与后台写回</text>

      <text class="body" x="46" y="858">带日志的 extent 文件写入空洞时先预留空间，</text>
      <text class="body" x="46" y="878">写回时才分配物理块。fsync 等待本次持久化目标。</text>
      <text class="small" x="46" y="897">ext4 / FAT32 / tmpfs / procfs</text>

      <rect class="card" x="554" y="669" width="502" height="221" rx="13"/>
      <rect x="574" y="686" width="35" height="35" rx="9" fill="#f2e6f6"/>
      <use href="#network" x="579.5" y="691.5" color="#81468e"/>
      <text class="heading" x="622" y="710">网络</text>
      <text class="body" x="576" y="738">程序通过文件描述符访问套接字。</text>
      <text class="body" x="576" y="761">支持 IPv4 TCP / UDP 及 IPv6 回环。</text>

      <rect x="576" y="772" width="72" height="22" rx="11" fill="#e1edff"/>
      <text class="small blue strong" x="612" y="788" text-anchor="middle">调用核</text>
      <text class="body" x="659" y="789">收发预约、用户数据复制与等待</text>
      <rect x="576" y="798" width="72" height="22" rx="11" fill="#ffedd8"/>
      <text class="small amber strong" x="612" y="814" text-anchor="middle">CPU0</text>
      <text class="body" x="659" y="815">lwIP 推进 TCP/IP 状态机与重传</text>

      <text class="body" x="576" y="844">IPv4 地址、掩码、默认网关与 MTU 可在运行时配置。</text>
      <text class="body" x="576" y="868">UNIX 套接字可传递文件描述符与消息凭据。</text>

      <rect x="24" y="926" width="1032" height="100" rx="12" fill="#eaf0fa" stroke="#c9d7ea"/>
      <text class="heading" x="46" y="952">跨子系统的 IPC 与等待</text>
      <text class="small strong" x="46" y="977">文件描述符就绪</text>
      <text class="small" x="46" y="999">poll / epoll / pselect</text>

      <text class="small strong" x="279" y="977">管道与 FIFO</text>
      <text class="small" x="279" y="999">容量可调，写入量不超过</text>
      <text class="small" x="279" y="1016">PIPE_BUF 时保持原子性</text>

      <text class="small strong" x="528" y="977">IPC 对象</text>
      <text class="small" x="528" y="999">SysV 共享内存、信号量和消息</text>
      <text class="small" x="528" y="1016">POSIX 优先级消息队列</text>

      <text class="small strong" x="797" y="977">futex</text>
      <text class="small" x="797" y="999">等待、唤醒和重排</text>
      <text class="small" x="797" y="1016">多地址等待与优先级继承</text>
    </g>

    <g transform="translate(0 89)" aria-label="设备驱动与数据路径">
      <rect x="48" y="1051" width="1104" height="81" rx="12" fill="#e3f2ee" stroke="#bfd8d0"/>
      <path class="wire storage-wire arrow" d="M84 809H32v299h51"/>
      <path class="wire network-wire arrow" d="M1116 789h52v319h-51"/>

      <use href="#board" x="67" y="1054" color="#28766d"/>
      <text class="section teal" x="104" y="1074">内核设备驱动</text>

      <rect class="card" x="84" y="1082" width="246" height="43" rx="8"/>
      <text class="body strong teal" x="100" y="1100">VirtIO 块设备</text>
      <text class="small" x="100" y="1118">共用块层 · 单队列批量请求</text>
      <rect class="card" x="346" y="1082" width="246" height="43" rx="8"/>
      <text class="body strong teal" x="362" y="1100">VirtIO RNG</text>
      <text class="small" x="362" y="1118">向内核随机源补充熵</text>
      <rect class="card" x="608" y="1082" width="246" height="43" rx="8"/>
      <text class="body strong" x="624" y="1100">串口与 RTC</text>
      <text class="small" x="624" y="1118">16550A 串口与平台实时时钟</text>
      <rect class="card" x="870" y="1082" width="246" height="43" rx="8"/>
      <text class="body strong teal" x="886" y="1100">VirtIO 网卡</text>
      <text class="small" x="886" y="1118">以太网收发 · 独立收发队列</text>
    </g>
  </g>

  <path class="wire arrow" d="M600 1234v35"/>
  <text class="small" x="620" y="1257">经平台接口访问设备</text>

  <g transform="translate(0 89)" aria-label="QEMU virt 平台">
    <rect x="24" y="1181" width="1152" height="125" rx="14" fill="#edf2f7" stroke="#c4d1e0"/>
    <text class="section" x="46" y="1206">QEMU virt 平台</text>
    <text class="small" x="1152" y="1205" text-anchor="end"><tspan class="amber strong">CPU0</tspan> 处理外设中断，各核处理本地定时器和 IPI</text>

    <rect x="48" y="1216" width="540" height="79" rx="9" fill="#eaf5fc" stroke="#bfdcee"/>
    <text class="heading rv" x="66" y="1236">RISC-V 64 · OpenSBI</text>
    <text class="body" x="66" y="1255">Sv39 / 4 KiB 页，通过设备树发现设备</text>
    <text class="small" x="66" y="1273">VirtIO 走 MMIO，SBI 设置定时器，PLIC 接收外设中断</text>
    <text class="small" x="66" y="1290">SBI HSM 启动其他核，再通过 IPI 握手</text>

    <rect x="612" y="1216" width="540" height="79" rx="9" fill="#faf0f5" stroke="#eac9da"/>
    <text class="heading la" x="630" y="1236">LoongArch 64 · LA464</text>
    <text class="body" x="630" y="1255">三级页表 / 16 KiB 页，枚举 PCI 设备并接入 VirtIO</text>
    <text class="small" x="630" y="1273">通过 QEMU -kernel 启动，使用扩展 I/O 中断控制器</text>
    <text class="small" x="630" y="1290">IOCSR 邮箱传递从核启动信息，IPI 唤醒从核</text>
  </g>
</svg>
