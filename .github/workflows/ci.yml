name: BoarOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boaros-ci-${{ github.ref }}
  # main 冷构建先保存固定环境；后续 push 排队，PR 仍只保留最新执行。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-contracts:
    name: Shared kernel and runner contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Install host contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf e2fsprogs python3-yaml git
      - name: Run shared contracts
        run: python3 -B tests/ci/run.py --arch host --suite host
      - name: Check patch formatting
        if: ${{ !cancelled() }}
        run: git diff --check HEAD^ HEAD
      - name: Validate workflow syntax and shell scripts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml .github/workflows/native-contracts.yml .github/workflows/native-extended.yml .github/workflows/recovery.yml
      - name: Preserve all host results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-host-contracts
          path: build/ci-run/host-host
          if-no-files-found: warn

  loongarch-environment:
    name: Prepare fixed LA native environment
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-environment
        with:
          arch: loongarch
          mode: prepare
      - name: Preserve LA environment preparation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loongarch-environment
          path: |
            build/loongarch/*.log
            build/loongarch/*identity*.json
            build/loongarch/dynamic*/identity.json
            build/qemu-la-rtc/boaros-identity.json
            build/qemu-la-rtc/**/meson-logs/*
            build/qemu-la-rtc/**/config.log
            build/linux-la*/boaros-identity.json
            build/linux-la*/.config
            build/tools/*/ci-identity.json
          include-hidden-files: true
          if-no-files-found: warn

  riscv-environment:
    name: Prepare fixed RV GNU environment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-environment
        with:
          arch: riscv
          mode: prepare
      - name: Preserve RV environment preparation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: riscv-environment
          path: |
            build/diff-abi/linux/**/build.log
            build/diff-abi/linux/**/configure.log
            build/diff-abi/linux/**/identity.json
            build/diff-abi/linux/**/.config
            build/tools/*/ci-identity.json
          include-hidden-files: true
          if-no-files-found: warn

  riscv-core:
    name: RISC-V core, ABI and platform
    needs: riscv-environment
    uses: ./.github/workflows/native-contracts.yml
    with:
      arch: riscv
      suite: core

  loongarch-core:
    name: LoongArch core, ABI and platform
    needs: loongarch-environment
    uses: ./.github/workflows/native-contracts.yml
    with:
      arch: loongarch
      suite: core

  riscv-runtime:
    name: RISC-V glibc 2.44 and SQLite
    needs: riscv-environment
    uses: ./.github/workflows/native-contracts.yml
    with:
      arch: riscv
      suite: runtime

  loongarch-runtime:
    name: LoongArch glibc 2.42 and SQLite
    needs: loongarch-environment
    uses: ./.github/workflows/native-contracts.yml
    with:
      arch: loongarch
      suite: runtime

  riscv-development:
    name: RISC-V guest native C development
    needs: riscv-environment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-environment
        with:
          arch: riscv
      - name: Run the independently verified RV native compiler consumer
        run: make INIT_CONFIG=config/init.json test-offline-c-riscv
      - name: Preserve native development observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: riscv-native-development
          path: build/riscv/offline-c-run.*/**/*
          if-no-files-found: warn
      - name: Preserve failed development disks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: riscv-native-development-failed-images
          path: build/riscv/offline-c-run.*/**/*.img
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: Main dual-architecture gate
    if: always()
    needs: [host-contracts, riscv-environment, loongarch-environment, riscv-core, loongarch-core, riscv-runtime, loongarch-runtime, riscv-development]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require every declared job
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -B tests/ci/run.py --check-jobs host-contracts riscv-environment \
            loongarch-environment riscv-core loongarch-core riscv-runtime loongarch-runtime riscv-development
