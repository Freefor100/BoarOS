name: Native architecture contracts

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      suite:
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ inputs.arch }} / ${{ inputs.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-environment
        id: native
        with:
          arch: ${{ inputs.arch }}
      - name: Record and select the actual SMP firmware
        if: ${{ inputs.arch == 'riscv' && inputs.suite == 'smp' }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          files = subprocess.check_output(['dpkg-query', '-L', 'opensbi'], text=True).splitlines()
          # Ubuntu installs both XLEN variants; RV64 cannot boot the RV32 image.
          candidates = [Path(p) for p in files
                        if p.endswith('/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin') and Path(p).is_file()]
          if len(candidates) != 1:
              raise SystemExit(f'Expected one installed RV64 generic OpenSBI image, found {candidates}')
          firmware = candidates[0].resolve(strict=True)
          qemu = Path(shutil.which('qemu-system-riscv64')).resolve(strict=True)
          def identity(path):
              return {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          report = {'firmware': identity(firmware), 'qemu': identity(qemu),
                    'qemu_version': subprocess.check_output([str(qemu), '--version'], text=True),
                    'opensbi_package': subprocess.check_output(['dpkg-query', '-W', 'opensbi'], text=True)}
          output = Path('build/riscv-smp/ci-executor.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as environment:
              environment.write(f'QEMU_RISCV_FIRMWARE={firmware}\n')
          PY
      - name: Run the declared native contracts
        env:
          TARGET_ARCH: ${{ inputs.arch }}
          TARGET_SUITE: ${{ inputs.suite }}
        run: python3 -B tests/ci/run.py --arch "$TARGET_ARCH" --suite "$TARGET_SUITE"
      - name: Prepare independent platform inputs
        if: ${{ !cancelled() && inputs.suite == 'core' && steps.native.outcome == 'success' }}
        id: platform
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          if [ "$TARGET_ARCH" = riscv ]; then
            make INIT_CONFIG=config/init.json prepare-program-environment
            python3 -B tests/program-inventory/environment.py --busybox
          fi
      - name: Run the declared platform contracts
        if: ${{ !cancelled() && inputs.suite == 'core' && steps.platform.outcome == 'success' }}
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: python3 -B tests/ci/run.py --arch "$TARGET_ARCH" --suite platform
      - name: Preserve complete observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ inputs.arch }}-${{ inputs.suite }}
          path: |
            build/ci-run/${{ inputs.arch }}-*
            build/riscv-smp/runs/**/*.log
            build/riscv-smp/runs/**/*.json
            build/riscv*-smp-test/runs/**/*.log
            build/riscv*-smp-test/runs/**/*.json
            build/riscv-smp/*.json
            build/${{ inputs.arch }}/**/*.log
            build/${{ inputs.arch }}/**/*.json
            build/${{ inputs.arch }}/**/*.normalized
            build/${{ inputs.arch }}/**/*.diff
            build/${{ inputs.arch }}/**/*.su
            build/stack-usage/**/*.su
            build/stack-usage/*.log
            build/io-sleep-run.*/*.log
            build/multi-disk-io.*/*.log
            build/multi-disk-io.*/*-timeout.json
            build/multi-disk-io.*/*-exit.json
            build/scale-run.*/boot.log
            build/diff-abi/run/*.log
            build/diff-abi/run/*.json
            build/diff-abi/run/*.normalized
            build/diff-abi/run/*.diff
            build/sched-handoff-*/*.log
            build/sched-handoff-*/*.json
            build/sched-handoff-*/*.normalized
            build/sched-handoff-*/*.diff
            build/exec-boundary-*/*.log
            build/exec-boundary-*/*.json
            build/exec-boundary-*/*.normalized
            build/exec-boundary-*/*.diff
            build/stack-elf-*/*.log
            build/stack-elf-*/*.json
            build/stack-elf-*/*.normalized
            build/stack-elf-*/*.diff
            build/elf-tail-riscv/**/suite.json
            build/elf-tail-riscv/**/result.json
            build/elf-tail-riscv/**/*.log
            build/network/contract-*/**/*.log
            build/network/contract-*/**/*.json
            build/program-environment/**/*.log
            build/program-environment/**/*.json
          if-no-files-found: warn
      - name: Preserve failed disks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-failed-images-${{ inputs.arch }}-${{ inputs.suite }}
          path: |
            build/${{ inputs.arch }}/**/*.img
            build/riscv*-smp-test/runs/**/*.img
            build/diff-abi/run/*.img
            build/sched-handoff-*/*.img
            build/exec-boundary-*/*.img
            build/stack-elf-*/*.img
            build/io-sleep-run.*/root.img
            build/multi-disk-io.*/*.img
            build/elf-tail-riscv/**/*.img
            build/network/contract-*/**/*.img
          retention-days: 7
          if-no-files-found: ignore
