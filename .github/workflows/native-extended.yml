name: Dual-architecture original programs and device lifecycle
on:
  workflow_dispatch:
  schedule:
    # Daily 03:17 Asia/Shanghai; the default branch supplies this workflow.
    - cron: '17 19 * * *'
permissions:
  contents: read
concurrency:
  group: native-extended-${{ github.ref }}
  cancel-in-progress: false
jobs:
  riscv-user-programs:
    name: User SMP original programs (${{ matrix.cpus }} CPU, ${{ matrix.memory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cpus: [2, 1]
        memory: [512M, 1G]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-environment
        with:
          arch: riscv
          mode: prepare
      - name: Select actual RV64 firmware
        run: python3 -B tests/ci/firmware.py --github-env
      - name: Prepare unchanged programs and user SMP kernel
        run: |
          python3 -B tests/program-inventory/run.py --arch riscv --build-only
          make INIT_CONFIG=config/init.json kernel-rv-user-smp
      - name: Run one independent strict profile
        env:
          TEST_CPUS: ${{ matrix.cpus }}
          TEST_MEMORY: ${{ matrix.memory }}
        run: |
          python3 -B tests/program-inventory/run.py --execution-profile rv-user-smp \
            --cpus "$TEST_CPUS" --memory "$TEST_MEMORY" --reuse-builds --require-pass \
            --firmware "$QEMU_RISCV_FIRMWARE" --output build/riscv-user-smp/programs-ci
      - name: Preserve complete per-case observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: user-smp-programs-${{ matrix.cpus }}cpu-${{ matrix.memory }}
          path: |
            build/riscv-user-smp/programs-ci/**/*.json
            build/riscv-user-smp/programs-ci/**/*.log
            build/riscv-smp/ci-executor.json
          if-no-files-found: warn
      - name: Preserve failed disks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: user-smp-programs-disks-${{ matrix.cpus }}cpu-${{ matrix.memory }}
          path: build/riscv-user-smp/programs-ci/**/*.img
          retention-days: 7
          if-no-files-found: ignore
  original-programs:
    name: Original programs and devices (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv, loongarch]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/native-environment
        with:
          arch: ${{ matrix.arch }}
          mode: prepare
      - name: Prepare complete consumer inputs and TAP capability
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if [ "$TARGET_ARCH" = riscv ]; then
            make INIT_CONFIG=config/init.json prepare-program-environment
            python3 -B tests/network_inputs.py
          fi
          python3 -B tests/program-inventory/run.py --arch "$TARGET_ARCH" --build-only
          python3 -B tests/ci/netns.py --configure-apparmor --github-env
      - name: Build the general fixture kernel
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if [ "$TARGET_ARCH" = riscv ]; then kernel='kernel-rv'; else kernel='kernel-la'; fi
          make INIT_CONFIG=config/init.json "$kernel"
      - name: Run the complete declared consumer set
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: python3 -B tests/ci/run.py --arch "$TARGET_ARCH" --suite extended
      - name: Release the temporary TAP namespace profile
        if: always()
        run: python3 -B tests/ci/netns.py --cleanup
      - name: Preserve full consumer and failure observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-extended-${{ matrix.arch }}
          path: |
            build/ci-run/*-extended
            build/tools/ci-netns/identity.json
            build/program-inventory-full/**/*.json
            build/program-inventory-full/**/*.log
            build/loongarch/program-inventory/**/*.json
            build/loongarch/program-inventory/**/*.log
            build/loongarch/**/*.log
            build/loongarch/**/*.json
            build/riscv/tty-run.*/**/*
            build/riscv/pty-run.*/**/*
            build/diff-abi/linux/**/build.log
            build/diff-abi/linux/**/configure.log
            build/diff-abi/linux/**/identity.json
            build/loongarch/*identity*.json
            build/qemu-la-rtc/**/meson-logs/*
            build/network*/**/*.log
            build/network*/**/*.json
            build/multi-disk-rt.*/*.log
          if-no-files-found: warn
      - name: Preserve failed consumer disks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-extended-failed-images-${{ matrix.arch }}
          path: |
            build/program-inventory-full/**/*.img
            build/loongarch/program-inventory/**/*.img
            build/riscv/tty-run.*/**/*.img
            build/riscv/pty-run.*/**/*.img
            build/loongarch/**/*.img
            build/network/**/*.img
            build/multi-disk-rt.*/*.img
          retention-days: 7
          if-no-files-found: ignore
